apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-foundation
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: ai-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 30m
  path: ./infrastructure/foundation
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: ai-addons
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
    - kind: ConfigMap
      name: ai-settings
  dependsOn:
  - name: cilium
---
