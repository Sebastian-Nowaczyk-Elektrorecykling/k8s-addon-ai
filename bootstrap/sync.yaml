apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-addons
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: ai-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 30m
  path: ./clusters/lan
  prune: true
  deletionPolicy: Orphan
  wait: false
  sourceRef:
    kind: GitRepository
    name: ai-addons
