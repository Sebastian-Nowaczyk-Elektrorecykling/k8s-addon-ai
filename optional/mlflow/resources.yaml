apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mlflow-db
  namespace: ai-tracking
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  storage:
    storageClass: longhorn-cnpg
    size: 10Gi
  bootstrap:
    initdb:
      database: app
      owner: app
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-db-database
  namespace: ai-tracking
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: mlflow-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 5432
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    ports:
    - port: 8000
      protocol: TCP
    - port: 5432
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: ai-tracking
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ${AI_STORAGE_CLASS}
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ai-tracking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v3.16.1-full@sha256:6af326440af64565c2ea5d1d28c9ee355f70a8d4af5b76e35938365e1ce2e428
        ports:
        - name: http
          containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        env:
        - name: MLFLOW_BACKEND_STORE_URI
          valueFrom:
            secretKeyRef:
              name: mlflow-db-app
              key: uri
        - name: MLFLOW_FLASK_SERVER_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mlflow-auth
              key: secret-key
        - name: MLFLOW_AUTH_CONFIG_PATH
          value: /etc/mlflow/basic_auth.ini
        args:
        - server
        - --host
        - 0.0.0.0
        - --port
        - '5000'
        - --app-name
        - basic-auth
        - --serve-artifacts
        - --artifacts-destination
        - /mlflow/artifacts
        - --allowed-hosts
        - mlflow.${DOMAIN},mlflow,mlflow.ai-tracking.svc.cluster.local,localhost,127.0.0.1
        - --workers
        - '1'
        - --cors-allowed-origins
        - https://mlflow.${DOMAIN}
        command:
        - mlflow
        volumeMounts:
        - name: data
          mountPath: /mlflow
        - name: auth
          mountPath: /etc/mlflow
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mlflow-data
      - name: auth
        secret:
          secretName: mlflow-auth
          items:
          - key: basic_auth.ini
            path: basic_auth.ini
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ai-tracking
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
  - name: http
    port: 5000
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlflow
  namespace: ai-tracking
spec:
  parentRefs:
  - name: internal
    namespace: gateway-system
    sectionName: apps-https
  hostnames:
  - mlflow.${DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 3600s
      backendRequest: 3600s
    backendRefs:
    - name: mlflow
      port: 5000
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mlflow-gateway
  namespace: ai-tracking
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '5000'
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-clients
  namespace: ai-tracking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-notebooks
      podSelector:
        matchLabels:
          app.kubernetes.io/name: notebook
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-workflows
      podSelector:
        matchLabels:
          app.kubernetes.io/name: langflow
    ports:
    - port: 5000
      protocol: TCP
