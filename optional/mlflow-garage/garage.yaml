apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ai-tracking
spec:
  template:
    spec:
      containers:
      - name: mlflow
        args:
        - server
        - --host
        - 0.0.0.0
        - --port
        - '5000'
        - --app-name
        - basic-auth
        - --serve-artifacts
        - --artifacts-destination
        - s3://ai-mlflow
        - --allowed-hosts
        - mlflow.${DOMAIN},mlflow,mlflow.ai-tracking.svc.cluster.local,localhost,127.0.0.1
        - --workers
        - '1'
        - --cors-allowed-origins
        - https://mlflow.${DOMAIN}
        env:
        - name: MLFLOW_S3_ENDPOINT_URL
          value: http://garage.garage.svc.cluster.local:3900
        - name: AWS_DEFAULT_REGION
          value: garage
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mlflow-s3
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mlflow-s3
              key: secret-access-key
