apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webui-data
  namespace: ai-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ${AI_STORAGE_CLASS}
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
      annotations:
        ai.elektro.internal/chat-model: ${AI_CHAT_MODEL}
        ai.elektro.internal/embed-model: ${AI_EMBED_MODEL}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        env:
        - name: WEBUI_URL
          value: https://chat.${DOMAIN}
        - name: ENABLE_SIGNUP
          value: 'false'
        - name: ENABLE_PERSISTENT_CONFIG
          value: 'false'
        - name: WEBUI_AUTH
          value: 'true'
        - name: ENABLE_OLLAMA_API
          value: 'false'
        - name: OPENAI_API_BASE_URL
          value: http://litellm:4000/v1
        - name: DEFAULT_MODELS
          value: local-chat
        - name: VECTOR_DB
          value: qdrant
        - name: QDRANT_URI
          value: http://qdrant:6333
        - name: RAG_EMBEDDING_ENGINE
          value: ollama
        - name: RAG_EMBEDDING_MODEL
          value: ${AI_EMBED_MODEL}
        - name: RAG_OLLAMA_BASE_URL
          value: http://ollama:11434
        - name: CONTENT_EXTRACTION_ENGINE
          value: tika
        - name: TIKA_SERVER_URL
          value: http://tika:9998
        - name: TIKA_SERVER_VERSION
          value: '3'
        - name: ENABLE_WEB_SEARCH
          value: 'true'
        - name: WEB_SEARCH_ENGINE
          value: searxng
        - name: SEARXNG_QUERY_URL
          value: http://searxng:8080/search?q=<query>&format=json
        - name: WEB_SEARCH_RESULT_COUNT
          value: '3'
        - name: WEB_SEARCH_CONCURRENT_REQUESTS
          value: '2'
        - name: ENABLE_CODE_EXECUTION
          value: 'false'
        - name: ENABLE_CODE_INTERPRETER
          value: 'false'
        - name: DO_NOT_TRACK
          value: 'true'
        - name: SCARF_NO_ANALYTICS
          value: 'true'
        - name: ANONYMIZED_TELEMETRY
          value: 'false'
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: webui-auth
              key: secret-key
        - name: WEBUI_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: webui-auth
              key: email
        - name: WEBUI_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: webui-auth
              key: password
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-auth
              key: master-key
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: qdrant-auth
              key: api-key
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai-system
spec:
  selector:
    app.kubernetes.io/name: open-webui
  ports:
  - name: http
    port: 8080
    targetPort: http
