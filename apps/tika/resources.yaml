apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  namespace: ai-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tika
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tika
        image: apache/tika:3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
        ports:
        - name: http
          containerPort: 9998
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx1536m
---
apiVersion: v1
kind: Service
metadata:
  name: tika
  namespace: ai-system
spec:
  selector:
    app.kubernetes.io/name: tika
  ports:
  - name: http
    port: 9998
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tika-clients
  namespace: ai-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tika
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: open-webui
    ports:
    - port: 9998
      protocol: TCP
