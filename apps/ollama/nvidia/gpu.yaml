apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-system
spec:
  template:
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: 'true'
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: ollama
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 16Gi
